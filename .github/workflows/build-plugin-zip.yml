name: Build AK Chatbot ZIP
on:
  push:
    branches:
      - feature/conversation-intelligence-v2
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Package installable plugin
        run: |
          mkdir -p package/wp-ai-chatbot dist
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='dist/' --exclude='package/' --exclude='wp-ai-chatbot.zip' --exclude='*.log' --exclude='.DS_Store' ./ package/wp-ai-chatbot/
          cd package
          zip -r ../dist/ak-deep-knowledge-ai-chatbot-2.0.0-intelligence.zip wp-ai-chatbot
      - uses: actions/upload-artifact@v4
        with:
          name: ak-chatbot-intelligence-zip
          path: dist/ak-deep-knowledge-ai-chatbot-2.0.0-intelligence.zip
          if-no-files-found: error
          retention-days: 7
